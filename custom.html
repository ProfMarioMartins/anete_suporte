<script>
  document.addEventListener("DOMContentLoaded", function () {
    const headings = document.querySelectorAll(".sidebar .toc-title, .sidebar h2, .sidebar h1");
    headings.forEach(h => {
      if (h.textContent.trim() === "Table of contents") {
        h.style.display = "none";
      }
    });
  });
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  setTimeout(function () {

    document.querySelectorAll(".sidebar .collapse.show, nav.sidebar .collapse.show").forEach(function(el) {
      el.classList.remove("show");
    });

    document.querySelectorAll(".sidebar [aria-expanded='true'], nav.sidebar [aria-expanded='true']").forEach(function(el) {
      el.setAttribute("aria-expanded", "false");
    });

  }, 150);
});
</script>
